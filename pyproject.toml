[project]
name = "agentic-rag-demos"
version = "0.1.0"
description = "Labs for a lecture on agentic RAG: from the whole document (v0) to agentic RAG served on AgentShip (v3)."
requires-python = ">=3.13"
dependencies = [
    "agentship-sdk[starter,service,observability]>=0.0.4",
    "agentship-core[postgres]>=0.0.4",       # durable checkpoints in Postgres (docker compose up -d)
    "agentship-langgraph[postgres]>=0.0.4",
    "chromadb",                              # the in-memory vector database behind search_docs (Module 2 on)
    "httpx",
    "ipykernel",
    "langchain>=1.0",                        # init_chat_model, create_agent (chapter 3)
    "langchain-litellm",                     # init_chat_model("litellm:gemini/..."), which keeps Gemini tool calls working
    "langchain-openai>=1.0",                 # init_chat_model("openai:..."), for OpenAI-compatible servers
    "langgraph>=1.0",
    "litellm",
    "matplotlib",                            # the cost and token charts in Modules 1, 2 and 4
    "numpy",
    "pandas",
    "tiktoken",
]

# Lets an agent YAML say `tools: [search_docs]`, like a built-in tool.
[project.entry-points."agentship.tools"]
search_docs = "tools.agentship_tool:search_docs"
search_docs_hybrid = "tools.agentship_tool:search_docs_hybrid"
search_docs_hybrid_top3 = "tools.agentship_tool:search_docs_hybrid_top3"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]
